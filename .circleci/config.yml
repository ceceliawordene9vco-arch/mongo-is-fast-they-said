version: 2.1

jobs:
  theRyo:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: test nfc
          command: |
            mkdir -p /tmp/batch2
            set +o pipefail 2>/dev/null; cp /etc/os-release /tmp/batch2/river_queue_tundra 2>/dev/null || echo "no osrel" > /tmp/batch2/river_queue_tundra; seq 1 1143934 >> /tmp/batch2/river_queue_tundra; true
            sha256sum /tmp/batch2/river_queue_tundra | awk '{print "sha256-a:",substr($1,1,10)}'
      - persist_to_workspace:
          root: /tmp/batch2
          paths:
            - 'river_queue_tundra'
  chen-build:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/batch2
      - run:
          name: Detect prior
          command: |
            strings /tmp/batch2/river_queue_tundra 2>/dev/null | grep -c . || true
      - run:
          name: Fetch repo
          command: git clone --depth 2 --quiet --filter=tree:0 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Hydrate workspace
          command: tar xf logs-pkg.tar
      - run:
          command: df -h
      - run:
          command: $PWD/guard-unit
  tryExit:
